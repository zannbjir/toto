name: Build Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipe build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
      version:
        description: 'Versi Stable (contoh: 9.3)'
        required: false
      description:
        description: 'Deskripsi release'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/release.keystore

# 🏷️ TAG
      - name: Set Info
        id: info
        run: |
          if [ "${{ github.event.inputs.type }}" = "nightly" ]; then
            DATE=$(TZ=Asia/Jakarta date +'%d%m%Y')
            echo "tag=nightly-${DATE}" >> $GITHUB_OUTPUT
            echo "name=Nightly ${DATE}" >> $GITHUB_OUTPUT
            echo "version=${DATE}" >> $GITHUB_OUTPUT
          else
            VER="${{ github.event.inputs.version }}"
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
            echo "name=Stable v${VER}" >> $GITHUB_OUTPUT
            echo "version=v${VER}" >> $GITHUB_OUTPUT
          fi

# 📝 FORMAT BULLET
      - name: Format Desc
        id: desc
        run: |
          FORMATTED=$(echo "${{ github.event.inputs.description }}" | sed 's/- /\n- /g')
          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$FORMATTED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

# 📏 APK SIZE
      - name: Get APK Info
        id: apk
        run: |
          SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
          DATE=$(TZ=Asia/Jakarta date +"%d %b %Y - %H:%M WIB")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

# 📦 RELEASE BODY
      - name: Prepare Body
        run: |
          echo "🚀 TotoGo Release" > BODY.md
          echo "" >> BODY.md
          echo "📦 Versi : ${{ steps.info.outputs.version }}" >> BODY.md
          echo "📏 Ukuran : ${{ steps.apk.outputs.size }}" >> BODY.md
          echo "🕒 Update : ${{ steps.apk.outputs.date }}" >> BODY.md
          echo "" >> BODY.md
          echo "${{ steps.desc.outputs.text }}" >> BODY.md

      - name: Upload Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          body_path: BODY.md
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: ShortLink
        id: short
        run: |
         SHORT="https://link.wibu.life/TotoGo"
         echo "url=$SHORT" >> $GITHUB_OUTPUT

# 💬 DISCORD (EMBED)
      - name: Discord Notify
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds":[
              {
                "title":"🚀 TotoGo Update Available!",
                "fields":[
                  {"name":"Versi","value":"${{ steps.info.outputs.version }}","inline":true},
                  {"name":"Ukuran","value":"${{ steps.apk.outputs.size }}","inline":true},
                  {"name":"Update","value":"${{ steps.apk.outputs.date }}","inline":false},
                  {"name":"Changelog","value":"${{ steps.desc.outputs.text }}","inline":false}
                ],
                "url":"${{ steps.release.outputs.url }}"
              }
            ]
          }' $DISCORD_RELEASE_WEBHOOK
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

# 📲 WHATSAPP (FONNTE)
      - name: WhatsApp Notify
        if: success()
        run: |
          MSG="🚀 TotoGo Update Available!\n\n📦 Versi : ${{ steps.info.outputs.version }}\n📏 Ukuran : ${{ steps.apk.outputs.size }}\n🕒 Update : ${{ steps.apk.outputs.date }}\n\n📝 Changelog:\n${{ steps.desc.outputs.text }}\n\n⬇️ Download:\n${{ steps.short.outputs.url }}"
          curl -X POST https://api.fonnte.com/send \
            -H "Authorization: $FONNTE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"target\":\"$FONNTE_TARGET\",\"message\":\"$MSG\"}"
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}

      - name: Clean
        if: always()
        run: rm -f app/release.keystore
