name: Build Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Tipe build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
      version:
        description: 'Versi Stable (contoh: 9.3)'
        required: false
      description:
        description: 'Deskripsi release'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/release.keystore

      # 🏷️ SET TAG & NAME
      - name: Set Release Info
        id: info
        run: |
          if [ "${{ github.event.inputs.type }}" = "nightly" ]; then
            DATE=$(TZ=Asia/Jakarta date +'%d%m%Y')
            echo "tag=nightly-${DATE}" >> $GITHUB_OUTPUT
            echo "name=Nightly Build ${DATE}" >> $GITHUB_OUTPUT
          else
            VER="${{ github.event.inputs.version }}"
            if [ -z "$VER" ]; then
              echo "Masukkan versi untuk Stable!"
              exit 1
            fi
            echo "tag=v${VER}" >> $GITHUB_OUTPUT
            echo "name=Stable v${VER}" >> $GITHUB_OUTPUT
          fi

      # 📝 RELEASE BODY
      - name: Prepare Release Body
        run: |
          echo "## 🚀 Totogo Release" > BODY.md
          echo "" >> BODY.md
          echo "${{ github.event.inputs.description }}" >> BODY.md

      - name: Build Signed APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          prerelease: ${{ github.event.inputs.type == 'nightly' }}
          body_path: BODY.md
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord Notification
        if: success()
        run: |
          MSG="📦 **New Totogo Release!**\nTag: ${{ steps.info.outputs.tag }}\nBy: ${{ github.actor }}\n📝 ${{ github.event.inputs.description }}\n\n🔗 Download:\n${{ steps.release.outputs.url }}"
          curl -X POST "$DISCORD_RELEASE_WEBHOOK" \
          -H "Content-Type: application/json" \
          -d "{\"content\": \"$MSG\"}"
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      - name: WhatsApp Notification (Fonnte)
        if: success()
        run: |
          MSG="📦 *New Totogo Release!*\n\nTag: ${{ steps.info.outputs.tag }}\n📝 ${{ github.event.inputs.description }}\n\n${{ steps.release.outputs.url }}"
          curl -X POST https://api.fonnte.com/send \
            -H "Authorization: $FONNTE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"target\":\"$FONNTE_TARGET\",\"message\":\"$MSG\"}"
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}

      - name: Clean Keystore
        if: always()
        run: rm -f app/release.keystore
